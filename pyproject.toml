[project]
name = "inference-server"
version = "0.2.0"
description = "Camera stream inference server — receives RPi MJPEG streams over TCP/TLS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "openvino>=2026.0.0",
    "aiohttp>=3.13.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
